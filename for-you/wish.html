<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You 💗</title>
  <meta name="description" content="Someone made something special for you." />
  <meta name="robots" content="noindex" />
  <meta property="og:title" content="Someone made something special for you 💗" />
  <meta property="og:description" content="Open this page — it's personal." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --blush: #ffe1ec;
      --blush-deep: #ffc2d9;
      --rose: #ff6fa0;
      --rose-deep: #e94d84;
      --plum: #5a2340;
      --plum-soft: #8a4467;
      --cream: #fff6f9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; min-height: 100%;
      font-family: 'Quicksand', sans-serif;
      background: var(--cream); color: var(--plum); overflow-x: hidden;
    }
    .stage {
      position: relative; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem 1.25rem;
      background:
        radial-gradient(circle at 15% 20%, var(--blush) 0%, transparent 50%),
        radial-gradient(circle at 85% 80%, var(--blush-deep) 0%, transparent 50%),
        linear-gradient(160deg, var(--cream), var(--blush) 80%);
    }
    .float-layer {
      position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1;
    }
    .drift {
      position: absolute; bottom: -5%; font-size: 20px; opacity: 0.5;
      animation: rise linear infinite; color: var(--rose);
    }
    @keyframes rise {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      10% { opacity: 0.55; }
      90% { opacity: 0.4; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }
    .card {
      position: relative; z-index: 5; max-width: 440px; width: 100%;
      text-align: center;
      background: rgba(255,255,255,0.72);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,194,217,0.55);
      border-radius: 24px;
      padding: 2.25rem 1.6rem 1.75rem;
      box-shadow: 0 16px 48px -16px rgba(233,77,132,0.3);
      opacity: 0; transform: translateY(16px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .card.show { opacity: 1; transform: translateY(0); }
    .eyebrow {
      font-size: 0.72rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--rose-deep); font-weight: 700; margin-bottom: 0.85rem;
    }
    .headline {
      font-family: 'Dancing Script', cursive; font-weight: 700;
      font-size: clamp(2.2rem, 8vw, 3.2rem); line-height: 1.1;
      color: var(--plum); margin-bottom: 0.35rem;
    }
    .headline span { color: var(--rose-deep); }
    .to-line { font-size: 1.05rem; color: var(--plum-soft); margin-bottom: 1.35rem; }
    .message {
      font-size: 1.05rem; line-height: 1.7; color: var(--plum);
      margin-bottom: 1.5rem; white-space: pre-wrap;
    }
    .from-line { font-size: 0.95rem; color: var(--plum-soft); margin-bottom: 1.5rem; }
    .from-line strong { color: var(--rose-deep); font-weight: 700; }
    .divider {
      width: 48px; height: 3px;
      background: linear-gradient(90deg, var(--rose), var(--rose-deep));
      border-radius: 99px; margin: 0 auto 1.35rem;
    }
    .actions {
      display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center;
    }
    .btn {
      font-family: inherit; font-weight: 600; font-size: 0.88rem;
      padding: 0.65rem 1.1rem; border-radius: 999px; border: none;
      cursor: pointer; text-decoration: none; color: #fff;
      display: inline-flex; align-items: center; gap: 0.35rem;
      transition: transform 0.15s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-wa { background: #25D366; }
    .btn-copy { background: var(--plum); }
    .btn-create { background: linear-gradient(135deg, var(--rose), var(--rose-deep)); }
    .error-box { text-align: center; max-width: 360px; padding: 2rem; }
    .error-box h1 {
      font-family: 'Dancing Script', cursive; font-size: 2rem; margin-bottom: 0.75rem;
    }
    .error-box a { color: var(--rose-deep); font-weight: 600; }
    .footer-note {
      margin-top: 1.5rem; font-size: 0.75rem; color: var(--plum-soft); opacity: 0.85;
    }
    .footer-note a { color: var(--rose-deep); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="float-layer" id="float-layer"></div>
  <div class="stage">
    <div class="card" id="card">
      <p class="eyebrow" id="eyebrow">A little something for you</p>
      <h1 class="headline" id="headline">hey <span id="to-name">you</span></h1>
      <p class="to-line" id="to-line"></p>
      <div class="divider"></div>
      <p class="message" id="message"></p>
      <p class="from-line">with love,<br><strong id="from-name"></strong></p>
      <div class="actions">
        <a class="btn btn-wa" id="wa-share" target="_blank" rel="noopener">Share on WhatsApp</a>
        <button type="button" class="btn btn-copy" id="copy-share">Copy link</button>
        <a class="btn btn-create" href="/for-you/">Create yours</a>
      </div>
      <p class="footer-note">Made with 💗 on <a href="https://bikasb.com.np">bikasb.com.np</a></p>
    </div>
    <div class="error-box" id="error" style="display:none;">
      <h1>Oops 💔</h1>
      <p>This page link looks incomplete or expired.</p>
      <p style="margin-top:1rem;"><a href="/for-you/">Create a new one →</a></p>
    </div>
  </div>

  <script>
    const COUNT_NS = 'bikasb-foryou';

    function decodePayload(str) {
      try {
        const b64 = str.replace(/-/g, '+').replace(/_/g, '/');
        const pad = b64.length % 4 === 0 ? '' : '='.repeat(4 - (b64.length % 4));
        return JSON.parse(decodeURIComponent(escape(atob(b64 + pad))));
      } catch { return null; }
    }

    function spawnHearts() {
      const layer = document.getElementById('float-layer');
      const symbols = ['💗', '💕', '✨', '🌸', '🎀', '💖'];
      for (let i = 0; i < 18; i++) {
        const el = document.createElement('span');
        el.className = 'drift';
        el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        el.style.left = Math.random() * 100 + '%';
        el.style.animationDuration = (10 + Math.random() * 14) + 's';
        el.style.animationDelay = (Math.random() * 8) + 's';
        el.style.fontSize = (14 + Math.random() * 16) + 'px';
        layer.appendChild(el);
      }
    }

    async function hitCounter(id) {
      if (!id) return;
      try { await fetch(`https://api.countapi.xyz/hit/${COUNT_NS}/${id}`); } catch (_) {}
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    (function init() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const data = decodePayload(params.get('d') || '');

      if (!data || !data.to || !data.from || !data.msg) {
        document.getElementById('card').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        return;
      }

      const isSister = data.type === 'sister';
      document.getElementById('eyebrow').textContent = isSister
        ? 'Happy Raksha Bandhan' : 'This isn’t a normal text';
      document.getElementById('to-name').textContent = data.to;
      document.getElementById('headline').innerHTML = isSister
        ? `hey <span>${escapeHtml(data.to)}</span>`
        : `okay, so… <span>hi</span>`;
      document.getElementById('to-line').textContent = isSister
        ? `A little rakhi of love for my sister`
        : `I couldn’t just text “hey” — felt too small.`;
      document.getElementById('message').textContent = data.msg;
      document.getElementById('from-name').textContent = data.from;

      const pageUrl = window.location.href;
      const waText = encodeURIComponent(
        isSister
          ? `Happy Raksha Bandhan 🎀 ${pageUrl}`
          : `Someone made something special for you 💗 ${pageUrl}`
      );
      document.getElementById('wa-share').href = `https://wa.me/?text=${waText}`;

      document.getElementById('copy-share').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(pageUrl);
          const btn = document.getElementById('copy-share');
          btn.textContent = 'Copied!';
          setTimeout(() => { btn.textContent = 'Copy link'; }, 1600);
        } catch {
          prompt('Copy this link:', pageUrl);
        }
      });

      spawnHearts();
      document.getElementById('card').classList.add('show');

      const seenKey = 'foryou_seen_' + id;
      if (id && !sessionStorage.getItem(seenKey)) {
        sessionStorage.setItem(seenKey, '1');
        hitCounter(id);
      }
    })();
  </script>
</body>
</html>
