<!DOCTYPE html>
<html lang="en-NP">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article | Bikash Bhandari ACCA</title>
  <meta name="description" content="Accounting article by Bikash Bhandari, ACCA." />
  <meta name="author" content="Bikash Bhandari, ACCA" />
  <meta name="robots" content="noindex, follow" id="meta-robots" />
  <link rel="canonical" href="https://bikasb.com.np/blog.html" id="canonical-link" />
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="Bikash Bhandari ACCA" />
  <meta property="og:title" content="Article | Bikash Bhandari ACCA" id="og-title" />
  <meta property="og:description" content="Accounting article by Bikash Bhandari, ACCA." id="og-description" />
  <meta property="og:url" content="https://bikasb.com.np/blog.html" id="og-url" />
  <meta property="og:image" content="https://bikasb.com.np/profile.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --acca-red: #E4002B;
      --acca-dark-gray: #251F20;
      --acca-cool-gray: #F4F5F7;
      --border-tint: #E2E8F0;
      --bg-color: #FFFFFF;
      --text-color: #251F20;
      --card-bg: #FFFFFF;
      --muted-text: #64748B;
    }
    [data-theme="dark"] {
      --bg-color: #0F1115;
      --text-color: #E2E8F0;
      --card-bg: #161A22;
      --border-tint: #374151;
      --muted-text: #94A3B8;
      --acca-dark-gray: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      line-height: 1.7;
      transition: background-color 0.3s, color 0.3s;
    }
    .navbar {
      position: sticky; top: 0; z-index: 1000;
      background: var(--card-bg) !important;
      border-bottom: 2px solid var(--acca-red);
      padding: 1rem 1.5rem;
    }
    .nav-container {
      max-width: 900px; margin: 0 auto;
      display: flex; justify-content: space-between; align-items: center;
    }
    .nav-logo {
      font-weight: 700; font-size: 1.3rem; text-decoration: none; color: var(--text-color);
    }
    .nav-logo span { color: var(--acca-red); }
    .nav-links { display: flex; gap: 1.25rem; list-style: none; align-items: center; }
    .nav-links a { text-decoration: none; color: var(--text-color); font-weight: 500; font-size: 0.95rem; }
    .nav-links a:hover { color: var(--acca-red); }
    .theme-toggle-btn {
      background: none; border: 1px solid var(--border-tint);
      padding: 0.4rem 0.9rem; border-radius: 4px; cursor: pointer; color: var(--text-color);
    }
    .menu-toggle { display: none; }
    @media (max-width: 868px) {
      .menu-toggle {
        display: flex; flex-direction: column; justify-content: space-between;
        width: 24px; height: 18px; background: transparent; border: none; cursor: pointer;
      }
      .menu-toggle span { width: 100%; height: 3px; background: var(--text-color); border-radius: 2px; }
      .nav-links {
        display: none; position: absolute; top: 100%; left: 0; right: 0;
        background: var(--card-bg); flex-direction: column; padding: 1rem 0;
        border-bottom: 2px solid var(--border-tint);
      }
      .nav-links.active { display: flex; }
      .nav-links a { padding: 0.75rem 1.5rem; width: 100%; text-align: center; }
    }
    .post-wrap {
      max-width: 720px; margin: 0 auto; padding: 3rem 1.5rem 4rem;
    }
    .post-meta {
      font-size: 0.9rem; color: var(--muted-text); margin-bottom: 0.75rem;
    }
    .post-meta .badge {
      display: inline-block; background: rgba(228,0,43,0.08); color: var(--acca-red);
      padding: 0.25rem 0.7rem; border-radius: 4px; font-weight: 600; font-size: 0.8rem;
      text-transform: uppercase; letter-spacing: 0.04em; margin-right: 0.5rem;
    }
    .post-title {
      font-size: 2.2rem; font-weight: 700; line-height: 1.2; margin-bottom: 1.5rem;
      border-left: 4px solid var(--acca-red); padding-left: 1rem;
    }
    .post-body { font-size: 1.05rem; }
    .post-body p { margin-bottom: 1.15rem; }
    .post-body h2 { font-size: 1.45rem; margin: 2rem 0 0.75rem; }
    .post-body h3 { font-size: 1.2rem; margin: 1.5rem 0 0.5rem; }
    .post-body ul, .post-body ol { margin: 0 0 1.15rem 1.4rem; }
    .post-body li { margin-bottom: 0.4rem; }
    .post-body a { color: var(--acca-red); }
    .post-body blockquote {
      border-left: 3px solid var(--acca-red); padding-left: 1rem; margin: 1.5rem 0;
      color: var(--muted-text); font-style: italic;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin-top: 2.5rem;
      padding: 0.65rem 1.15rem;
      color: var(--acca-red);
      font-weight: 600;
      text-decoration: none;
      border: 1.5px solid var(--acca-red);
      border-radius: 6px;
      background: transparent;
      transition: background 0.2s, color 0.2s;
    }
    .back-link:hover {
      background: var(--acca-red);
      color: #FFFFFF;
      text-decoration: none;
    }
    [data-theme="dark"] .back-link {
      color: #ff6b81;
      border-color: #ff6b81;
    }
    [data-theme="dark"] .back-link:hover {
      background: #ff6b81;
      color: #0F1115;
    }
    .footer {
      background: var(--acca-dark-gray, #0d0f12);
      color: #94A3B8;
      padding: 2rem 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      border-top: 1px solid var(--border-tint);
    }
    [data-theme="dark"] .footer {
      background: #0a0c10;
      color: #94A3B8;
      border-top-color: #374151;
    }
    .footer a {
      color: #94A3B8;
      text-decoration: none;
    }
    .footer a:hover {
      color: #E4002B;
    }
    /* Ensure injected status text respects theme */
    #post-root > p {
      color: var(--text-color);
    }
  
    /* ===== Liquid Glass Navbar (iOS 26 style) ===== */
    .navbar {
      position: fixed !important;
      top: 0 !important; left: 0 !important; right: 0 !important; width: 100% !important;
      z-index: 1000 !important;
      padding: 0.55rem 0.75rem !important;
      border: none !important;
      border-bottom: 0.5px solid rgba(255,255,255,0.22) !important;
      background: rgba(255,255,255,0.22) !important;
      backdrop-filter: blur(40px) saturate(190%) brightness(1.08) !important;
      -webkit-backdrop-filter: blur(40px) saturate(190%) brightness(1.08) !important;
      box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.55), 0 8px 32px rgba(0,0,0,0.06) !important;
      transition: background 0.25s ease, box-shadow 0.25s ease, padding 0.25s ease !important;
      overflow: visible !important;
    }
    html[data-theme="dark"] .navbar {
      background: rgba(20,20,28,0.35) !important;
      border-bottom: 0.5px solid rgba(255,255,255,0.12) !important;
    }
    .navbar.scrolled {
      background: rgba(255,255,255,0.32) !important;
      backdrop-filter: blur(44px) saturate(200%) brightness(1.1) !important;
      -webkit-backdrop-filter: blur(44px) saturate(200%) brightness(1.1) !important;
    }
    html[data-theme="dark"] .navbar.scrolled {
      background: rgba(20,20,28,0.5) !important;
    }
    .nav-container { position: relative !important; z-index: 1 !important; padding: 0 0.5rem !important; gap: 0.5rem !important; }
    body { padding-top: 3.35rem !important; }

    /* Nav text contrast on glass */
    .navbar .nav-logo,
    .navbar .nav-links a,
    .navbar .theme-toggle-btn {
      color: #1a1520 !important;
      text-shadow: 0 1px 0 rgba(255,255,255,0.55);
      font-weight: 600;
    }
    .navbar .nav-links a:hover,
    .navbar .nav-links a.active {
      color: #C40026 !important;
    }
    .navbar .logo-accent,
    .navbar .nav-logo span {
      color: #E4002B !important;
      text-shadow: none;
    }
    .navbar .theme-toggle-btn {
      border-color: rgba(26,21,32,0.25) !important;
      background: rgba(255,255,255,0.35) !important;
    }
    .navbar .theme-toggle-btn:hover {
      border-color: #E4002B !important;
      color: #C40026 !important;
    }
    .navbar .menu-toggle span {
      background-color: #1a1520 !important;
    }
    html[data-theme="dark"] .navbar .nav-logo,
    html[data-theme="dark"] .navbar .nav-links a,
    html[data-theme="dark"] .navbar .theme-toggle-btn {
      color: #F1F5F9 !important;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
    }
    html[data-theme="dark"] .navbar .nav-links a:hover,
    html[data-theme="dark"] .navbar .nav-links a.active {
      color: #FF6B81 !important;
    }
    html[data-theme="dark"] .navbar .theme-toggle-btn {
      border-color: rgba(241, 245, 249, 0.3) !important;
      background: rgba(15, 23, 42, 0.4) !important;
    }
    html[data-theme="dark"] .navbar .menu-toggle span {
      background-color: #F1F5F9 !important;
    }

    /* Mobile drawer: solid enough to stay readable over page content */
    @media (max-width: 868px) {
      .navbar .nav-links {
        background: rgba(255, 255, 255, 0.96) !important;
      }
      .navbar .nav-links a { text-shadow: none; }
      html[data-theme="dark"] .navbar .nav-links {
        background: rgba(15, 23, 42, 0.96) !important;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .navbar { transition: none !important; }
    }
    /* ===== End Liquid Glass Navbar ===== */

</style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">BIKASH ACCA<span>.</span></a>
      <button class="menu-toggle" id="mobile-menu-btn" aria-label="Toggle Navigation" onclick="toggleMobileMenu()">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="nav-menu-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Profile</a></li>
        <li><a href="/resources/">Resources</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><button class="theme-toggle-btn" id="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button></li>
      </ul>
    </div>
  </nav>

  <main class="post-wrap" id="post-root">
    <p style="color: var(--muted-text);">Loading article…</p>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Bikash Bhandari. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/contentful@10/dist/contentful.browser.min.js"></script>
  <script src="js/contentful-blog.js"></script>
  <script>
    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('saved-theme', next);
      const btn = document.getElementById('theme-toggle');
      if (btn) btn.innerText = next === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
    }
    function toggleMobileMenu() {
      document.getElementById('mobile-menu-btn').classList.toggle('open');
      document.getElementById('nav-menu-links').classList.toggle('active');
    }
    (function() {
      const saved = localStorage.getItem('saved-theme') || 'light';
      document.documentElement.setAttribute('data-theme', saved);
      const btn = document.getElementById('theme-toggle');
      if (btn) btn.innerText = saved === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
    })();

    (function() {
      const root = document.getElementById('post-root');
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      function setMeta(name, content, attr) {
        attr = attr || 'name';
        var el = document.querySelector('meta[' + attr + '="' + name + '"]');
        if (!el) {
          el = document.createElement('meta');
          el.setAttribute(attr, name);
          document.head.appendChild(el);
        }
        el.setAttribute('content', content);
      }

      function applySeo(p, postId) {
        var pageUrl = 'https://bikasb.com.np/post.html?id=' + encodeURIComponent(postId);
        var title = (p.title || 'Article') + ' | Bikash Bhandari ACCA';
        var desc = (p.description || '').trim() || ('Accounting article: ' + (p.title || ''));
        if (desc.length > 160) desc = desc.slice(0, 157) + '...';

        document.title = title;

        var robots = document.getElementById('meta-robots');
        if (robots) robots.setAttribute('content', 'index, follow');

        var canon = document.getElementById('canonical-link');
        if (canon) canon.setAttribute('href', pageUrl);

        setMeta('description', desc);
        var ogTitle = document.getElementById('og-title');
        var ogDesc = document.getElementById('og-description');
        var ogUrl = document.getElementById('og-url');
        if (ogTitle) ogTitle.setAttribute('content', title);
        if (ogDesc) ogDesc.setAttribute('content', desc);
        if (ogUrl) ogUrl.setAttribute('content', pageUrl);
        setMeta('og:title', title, 'property');
        setMeta('og:description', desc, 'property');
        setMeta('og:url', pageUrl, 'property');

        // JSON-LD Article
        var old = document.getElementById('post-jsonld');
        if (old) old.remove();
        var ld = document.createElement('script');
        ld.type = 'application/ld+json';
        ld.id = 'post-jsonld';
        ld.textContent = JSON.stringify({
          '@context': 'https://schema.org',
          '@type': 'BlogPosting',
          'headline': p.title || 'Article',
          'description': desc,
          'datePublished': p.createdAt || undefined,
          'author': { '@type': 'Person', 'name': 'Bikash Bhandari' },
          'publisher': { '@type': 'Person', 'name': 'Bikash Bhandari' },
          'mainEntityOfPage': pageUrl,
          'url': pageUrl
        });
        document.head.appendChild(ld);
      }

      if (!id) {
        root.innerHTML = '<p>No article selected. <a class="back-link" href="/blog.html">← Back to Blog</a></p>';
        return;
      }
      BikashBlog.fetchPostById(id)
        .then(function(p) {
          applySeo(p, id);
          root.innerHTML =
            '<div class="post-meta">' +
              (p.category ? '<span class="badge">' + p.category.replace(/</g,'&lt;') + '</span>' : '') +
              (p.date || '') +
            '</div>' +
            '<h1 class="post-title">' + p.title.replace(/</g,'&lt;') + '</h1>' +
            (p.description ? '<p class="post-dek" style="color:var(--muted-text);font-size:1.05rem;margin-bottom:1.5rem;">' + p.description.replace(/</g,'&lt;') + '</p>' : '') +
            '<div class="post-body">' + (p.contentHtml || '<p></p>') + '</div>' +
            '<a class="back-link" href="/blog.html">← Back to Blog</a>';
        })
        .catch(function(err) {
          console.error(err);
          var robots = document.getElementById('meta-robots');
          if (robots) robots.setAttribute('content', 'noindex, follow');
          document.title = 'Article not found | Bikash Bhandari ACCA';
          root.innerHTML = '<p>This article is no longer available. <a class="back-link" href="/blog.html">← Back to Blog</a></p>';
        });
    })();
  </script>
  <script>
    (function () {
      var navbar = document.getElementById('navbar') || document.querySelector('.navbar');
      if (!navbar) return;
      function onScroll() {
        if (window.scrollY > 40) navbar.classList.add('scrolled');
        else navbar.classList.remove('scrolled');
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();
    })();
  </script>
</body>
</html>
