# Cloudflare Workers / Pages static site configuration
name = "site"
main = "worker.js"
compatibility_date = "2026-08-08"

[assets]
# Serve files directly from the repository root (no build step)
directory = "."
binding = "ASSETS"
run_worker_first = ["/post.html", "/api/*"]
not_found_handling = "404-page"


[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "bikasb-analytics"
database_id = "2c4deb4d-43fe-40a0-8a0b-7625e16ace3b"
migrations_dir = "migrations"
